name: tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - "v[0-9]+*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The package advertises PHP >=8.1, so every advertised version is tested.
  # Named arguments and enums are 8.1 features; this matrix is what keeps a
  # newer-only syntax slip from shipping silently.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ["8.1", "8.2", "8.3", "8.4"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@ccf2c627fe61b1b4d924adfcbd19d4833efad13a # v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: curl, json
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run tests
        run: vendor/bin/phpunit --no-coverage

  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@ccf2c627fe61b1b4d924adfcbd19d4833efad13a # v2
        with:
          php-version: '8.3'
          extensions: curl, json
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Validate composer.json
        run: composer validate --strict

      - name: PHPStan
        run: vendor/bin/phpstan analyse --no-progress
